group 'io.openim.flutter_openim_sdk'
version '1.0'

// Store project directory at configuration time to avoid project access during task execution
def dir = projectDir.toString()

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
    }
}

rootProject.allprojects {
    repositories {
        // Put aar in libs, local repository replaces remote repository
        maven { url "$dir/libs" }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace "io.openim.flutter.openim_sdk"
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Local dependency, copy aar to libs/io/openim/core-sdk/0.0.1/ and name it core-sdk-0.0.1.aar
   implementation 'io.openim:core-sdk:0.0.1@aar'
}