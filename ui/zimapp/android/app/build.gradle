plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'com.huawei.agconnect'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "io.openim"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { 
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "io.openim.flutter.enterprise"
        minSdk 29
        targetSdk 33
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        ndk { abiFilters "arm64-v8a"/*, "x86_64"*/ }

        manifestPlaceholders += [
            GETUI_APPID    : "",
            XIAOMI_APP_ID  : "",
            XIAOMI_APP_KEY : "",
            MEIZU_APP_ID   : "",
            MEIZU_APP_KEY  : "",
            HUAWEI_APP_ID  : "",
            OPPO_APP_KEY   : "",
            OPPO_APP_SECRET: "",
            VIVO_APP_ID    : "",
            VIVO_APP_KEY   : "",
            HONOR_APP_ID   : "",
            JPUSH_PKGNAME  : applicationId,
            JPUSH_APPKEY   : "",
            JPUSH_CHANNEL  : "",
            appAuthRedirectScheme: 'com.googleusercontent.apps.276390714151-s3oi687vd73ctgnagkakgu21io03g028'
        ]
    }

    signingConfigs {
        release {
            keyAlias 'openim'
            keyPassword 'openim'
            storeFile file('./openim')
            storePassword 'openim'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.release }
        profile { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    lint {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // getui - disabled for zim_sdk build
    // implementation 'com.getui:gtsdk:3.3.12.0'
    // implementation 'com.getui:gtc:3.2.18.0'
    // implementation 'com.getui.opt:hwp:3.1.0'
    // implementation 'com.huawei.hms:push:6.1.0.300'
    // implementation 'com.getui.opt:xmp:3.2.0'
    // implementation('com.assist-v3:oppo:3.1.0') { exclude group: 'commons-codec'; exclude group: 'com.heytap.msp', module: 'push' }
    // implementation 'com.assist-v3:vivo:3.1.0'
    // implementation 'com.getui.opt:mzp:3.2.0'
    // implementation 'com.getui.opt:ups:3.0.3'
    // implementation 'com.getui.opt:honor:3.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"

    // jpush
    implementation 'cn.jiguang.sdk:jpush:5.6.0'
    implementation 'cn.jiguang.sdk.plugin:huawei:5.6.0'
}

static def buildTime() {
    return new Date().format("MMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}
