name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Stable toolchain: permanent download URL (dev snapshots get
  # garbage-collected from ziglang.org, which broke the first CI run).
  # Verified locally on 0.17.1: build + 41/41 tests pass.
  ZIG_VERSION: "0.17.1"
  ZMODU_VERSION: "v0.43.9"
  ZENT_VERSION: "snap-2026-11-20"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n0x
          POSTGRES_DB: zim
          # Local dev connects without a password (trust) — the container
          # refuses to initialize without this or POSTGRES_PASSWORD.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n0x"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        # libpq headers: zim's translate-c binding + the zent Postgres driver.
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Zig (direct tarball)
        # setup-zig builds old-pattern URLs that 404 for current dev builds;
        # same download strategy as zmodu's own CI.
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Checkout zmodu dependency
        # build.zig.zon resolves `../../../zig_ws/zigmodu` from src/, i.e.
        # GITHUB_WORKSPACE/../../zig_ws/zigmodu on a standard runner.
        # (repo renamed chy3xyz/zigmodu → chy3xyz/zmodu; the local checkout
        # dir keeps the old name to match build.zig.zon's path)
        uses: actions/checkout@v4
        with:
          repository: chy3xyz/zmodu
          ref: v0.43.9
          path: zig_ws/zigmodu

      - name: Checkout zent dependency
        uses: actions/checkout@v4
        with:
          repository: chy3xyz/zent
          ref: snap-2026-11-20
          path: zig_ws/zent

      - name: Map dependency paths for build.zig.zon
        # src/../zig_ws must exist outside the workspace dir; point it at the
        # in-workspace checkouts via symlinks.
        run: |
          mkdir -p ../zig_ws
          ln -s "$GITHUB_WORKSPACE/zig_ws/zigmodu" ../zig_ws/zigmodu
          ln -s "$GITHUB_WORKSPACE/zig_ws/zent" ../zig_ws/zent

      - name: Build
        working-directory: src
        run: zig build

      - name: Test
        working-directory: src
        run: zig build test

      - name: Format check
        working-directory: src
        run: zig fmt --check build.zig main.zig core.zig tests.zig zent_db.zig zent_schemas.zig modules/ proto/

      - name: Build zmodu CLI (audit/deadcode)
        working-directory: ../../zig_ws/zigmodu/tools/zmodu
        run: zig build --prefix $GITHUB_WORKSPACE/.zmodu-ci

      - name: Audit + deadcode
        working-directory: src
        run: |
          $GITHUB_WORKSPACE/.zmodu-ci/bin/zmodu audit .
          $GITHUB_WORKSPACE/.zmodu-ci/bin/zmodu deadcode .

      - name: Smoke (boot + health)
        working-directory: src
        run: |
          ./zig-out/bin/zim > /tmp/zim-ci.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:10000/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://localhost:10000/health >/dev/null || { cat /tmp/zim-ci.log; exit 1; }
          pkill -f zig-out/bin/zim || true

  frontend:
    runs-on: ubuntu-latest
    # The e2e step boots the zim backend against a real PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n0x
          POSTGRES_DB: zim
          # Local dev connects without a password (trust) — the container
          # refuses to initialize without this or POSTGRES_PASSWORD.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n0x"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ui/zimapp
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
        working-directory: .

      - name: Install Zig (direct tarball)
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
        working-directory: .

      - name: Checkout zmodu dependency
        uses: actions/checkout@v4
        with:
          repository: chy3xyz/zmodu
          ref: v0.43.9
          path: zig_ws/zigmodu

      - name: Checkout zent dependency
        uses: actions/checkout@v4
        with:
          repository: chy3xyz/zent
          ref: snap-2026-11-20
          path: zig_ws/zent

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7

      - name: Pub get (root + sub packages)
        run: |
          dart pub get
          for p in openim_common openim_working_circle openim_organization zim_sdk; do
            (cd $p && dart pub get)
          done

      - name: Analyze (must be zero errors)
        run: dart analyze

      - name: Test (zim_sdk protocol contract)
        working-directory: zim_sdk
        run: flutter test test/message_model_test.dart

      - name: Build backend for e2e integration test
        # The zim_sdk integration test talks to a real zim backend (HTTP+WS).
        working-directory: src
        run: |
          zig build
          ./zig-out/bin/zim > /tmp/zim-e2e-ci.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:10000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:10000/health >/dev/null || { cat /tmp/zim-e2e-ci.log; exit 1; }

      - name: E2E integration test (flutter SDK ↔ zim backend)
        working-directory: ui/zimapp/zim_sdk
        run: flutter test test/backend_integration_test.dart
        env:
          ZIM_E2E: "1"

      - name: Stop backend
        run: pkill -f zig-out/bin/zim || true
        if: always()
